<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - REDE</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    body.bg-login-image {
      background-image: url('../frontend/img/TELA-LOGIN-.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      position: relative;
      overflow: hidden;
    }

    .robot-large {
      position: absolute;
      top: 50%;
      left: 22%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
    }

    .robot-large i {
      font-size: 9rem;
      margin-bottom: 1.5rem;
    }

    .robot-large span {
      font-size: 2rem;
      font-weight: 600;
      color: #0f172a;
    }

    .robot-small {
      position: absolute;
      top: 2.5rem;
      right: 3rem;
      color: #ffffff;
      font-size: 3rem;
    }

    .login-container {
      position: absolute;
      top: 50%;
      right: 18%;
      transform: translateY(-50%);
      background-color: #1e293b;
      padding: 3.5rem;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: none;
    }

    .login-container h1 {
      color: #ffffff;
      text-align: center;
      margin-bottom: 2.5rem;
      font-size: 2.2rem;
      font-weight: 600;
    }

    .login-container .form-group {
      margin-bottom: 1.5rem;
    }

    .login-container .form-group label {
      display: block;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 0.6rem;
    }

    .login-container .form-group input {
      width: 100%;
      background-color: #ffffff;
      color: #0f172a;
      border: none;
      padding: 1rem;
      border-radius: 4px;
      font-size: 1.1rem;
      box-sizing: border-box;
    }

    .login-container .form-group input:focus {
      outline: 2px solid #6366f1;
    }

    .login-container button {
      background-color: #6366f1;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 1.2rem;
      font-size: 1.1rem;
      font-weight: 600;
      width: 60%;
      display: block;
      margin: 2rem auto 0 auto;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .login-container button:hover {
      background-color: #4f46e5;
    }

    body.bg-login-image footer {
      position: absolute;
      bottom: 1rem;
      width: 100%;
      color: #ffffff;
      opacity: 0.7;
      text-align: center;
      left: 0;
    }
  </style>
</head>
<body class="bg-login-image">

  <div class="robot-large">
    <i class="fas fa-robot"></i>
    <span>Olá, Bem vindo</span>
  </div>

  <div class="robot-small">
    <i class="fas fa-robot"></i>
  </div>

  <div class="login-container">
    <h1>Entrar na REDE</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit">Entrar</button>
      <p id="error-message" class="error-text"></p>
    </form>
  </div>
  
  <footer>
    <p>Feito por Rafael</p>
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = e.target.username.value;
      const password = e.target.password.value;
      const errorMessage = document.getElementById('error-message');
  
      const details = {
          'username': username,
          'password': password
      };
      const formBody = Object.keys(details).map(key => encodeURIComponent(key) + '=' + encodeURIComponent(details[key])).join('&');

      try {
        const response = await fetch('/token', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
          },
          body: formBody
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.detail || 'Falha no login');
        }

        const data = await response.json();
        localStorage.setItem('accessToken', data.access_token);
        window.location.href = '/app';

      } catch (error) {
        errorMessage.textContent = 'Erro: ' + error.message;
        console.error('Login error:', error);
      }
    });
  </script>
</body>
</html>
